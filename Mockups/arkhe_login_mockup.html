          onblur="this.style.borderColor='#D1D5DB'; this.style.boxShadow='none'; this.style.background='#FAFBFC';"

           onmouseout="this.style.color='#8A6F52'; this.style.textDecoration='none';">
          ¿Olvidó su contraseña?
        </a>
      </div>

      <!-- Botón Iniciar Sesión -->
      <button 
        type="submit"
        style="width: 100%; padding: 12px 16px; background: linear-gradient(135deg, #8A6F52 0%, #6E5A3C 100%); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 2px 8px rgba(138, 111, 82, 0.22); text-transform: uppercase; letter-spacing: 0.5px;"
        onmouseover="this.style.boxShadow='0 4px 12px rgba(138, 111, 82, 0.35)'; this.style.transform='translateY(-1px)';"
        onmouseout="this.style.boxShadow='0 2px 8px rgba(138, 111, 82, 0.22)'; this.style.transform='translateY(0)';"
        onmousedown="this.style.transform='translateY(0)'; this.style.boxShadow='0 1px 4px rgba(138, 111, 82, 0.22)';"
        onmouseup="this.style.transform='translateY(-1px)'; this.style.boxShadow='0 4px 12px rgba(138, 111, 82, 0.35)';"
        onclick="event.preventDefault(); alert('Bienvenido a ARKHE - Gestión Inmobiliaria Profesional');"
      >
        Iniciar sesión
      </button>
    </form>
