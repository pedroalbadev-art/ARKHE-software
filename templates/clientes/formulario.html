{% extends "base.html" %}

{% block title %}Editar Cliente - ARKHE{% endblock %}
{% block titulo_pagina %}Editar Cliente{% endblock %}

{% block content %}
  <div class="tarjeta form-card">
    <h3>{{ cliente.nombre_completo }}</h3>
    <form method="post" action="{{ url_for('clientes.actualizar_cliente', id_cliente=cliente.id_cliente) }}" class="form-grid">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" name="nombre" value="{{ cliente.nombre }}" required
               pattern="[A-Za-zÁÉÍÓÚÜáéíóúüÑñ ]+" title="Solo letras y espacios">
      </div>
      <div class="form-group">
        <label>Apellido</label>
        <input type="text" name="apellido" value="{{ cliente.apellido }}" required
               pattern="[A-Za-zÁÉÍÓÚÜáéíóúüÑñ ]+" title="Solo letras y espacios">
      </div>
      <div class="form-group">
        <label>Numero de documento</label>
        <input type="text" name="documento" value="{{ cliente.documento }}" required
               pattern="[0-9]{6,15}" title="Solo numeros (6 a 15 digitos)">
      </div>
      <div class="form-group">
        <label>Telefono</label>
        <input type="tel" name="telefono" value="{{ cliente.telefono }}" required
               pattern="[0-9]{7,15}" title="Solo numeros (7 a 15 digitos)">
      </div>
      <div class="form-group full">
        <label>Correo electronico</label>
        <input type="email" name="correo" value="{{ cliente.correo }}" required>
      </div>
      <div class="form-actions">
        <a class="btn btn-secondary" href="{{ url_for('clientes.listar_clientes') }}">Cancelar</a>
        <button type="submit" class="btn btn-primary">Guardar cambios</button>
      </div>
    </form>
  </div>
{% endblock %}
