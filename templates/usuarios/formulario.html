{% extends "base.html" %}

{% block title %}Editar Usuario - ARKHE{% endblock %}
{% block titulo_pagina %}Editar Usuario{% endblock %}

{% block content %}
  <div class="tarjeta form-card">
    <h3>{{ usuario.nombre_completo }}</h3>
    <form method="post" action="{{ url_for('usuarios.actualizar_usuario', id_usuario=usuario.id_usuario) }}" class="form-grid">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" name="nombre" value="{{ usuario.nombre }}" required
               pattern="[A-Za-zÁÉÍÓÚÜáéíóúüÑñ ]+" title="Solo letras y espacios">
      </div>
      <div class="form-group">
        <label>Apellido</label>
        <input type="text" name="apellido" value="{{ usuario.apellido }}" required
               pattern="[A-Za-zÁÉÍÓÚÜáéíóúüÑñ ]+" title="Solo letras y espacios">
      </div>
      <div class="form-group full">
        <label>Correo electronico</label>
        <input type="email" name="correo" value="{{ usuario.correo }}" required>
      </div>
      <div class="form-group full">
        <label>Nueva contraseña</label>
        <input type="password" name="contrasena" placeholder="Minimo 8 caracteres" minlength="8">
        <small>Dejar en blanco para no cambiarla.</small>
      </div>
      <div class="form-group">
        <label>Rol</label>
        <select name="rol" required>
          {% for rol in roles %}
          <option value="{{ rol }}" {{ 'selected' if usuario.rol == rol }}>{{ rol }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Estado</label>
        <select name="estado" required>
          <option value="activo" {{ 'selected' if usuario.estado == 'activo' }}>Activo</option>
          <option value="inactivo" {{ 'selected' if usuario.estado == 'inactivo' }}>Inactivo</option>
        </select>
      </div>
      <div class="form-actions">
        <a class="btn btn-secondary" href="{{ url_for('usuarios.listar_usuarios') }}">Cancelar</a>
        <button type="submit" class="btn btn-primary">Guardar cambios</button>
      </div>
    </form>
  </div>
{% endblock %}
