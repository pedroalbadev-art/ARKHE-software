; Configuracion de pytest para ARKHE (GA9-220501096-AA1-EV01).
; - testpaths: pytest busca las pruebas solo en la carpeta tests/
; - pythonpath: agrega la raiz del proyecto para poder importar utils/
; - addopts -v: muestra el nombre de cada prueba y su resultado
[pytest]
testpaths = tests
pythonpath = .
addopts = -v
